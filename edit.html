<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="images/diamond-half-gold.svg" />
  <link rel="stylesheet" href="main.css" />
  <title>Edit Place</title>
</head>

<body>
  <style>
    body {
      background-color: #111;
      color: #c0c0c0;
      padding: 1rem;
      overflow-y: scroll;
    }

    form textarea {
      width: 15rem;
      height: 5rem;
    }

    .delete {
      background-color: #ff0054;
      color: white;
    }

    a {
      color: #c0c0c0;
      text-decoration: none;
    }

    a:hover {
      color: #aea787;
    }
  </style>

  <div style="display: flex; gap: 1rem;">
    <a href="add.html">
      <h3>Add Place</h3>
    </a>
    <h3 style="color: #aea787;">Edit Place</h3>
  </div>
  <hr style="margin-top: 1rem; border: none; border-top: 1px solid #333" />
  &nbsp;

  <p>
    Search: &nbsp;<input type="text" name="search" id="search" style="margin-right: 1rem" /><button id="places_search"
      style="margin-right: 1rem">Search</button><br>
    <hr style="margin-top: 1rem; border: none; border-top: 1px solid #333" /><br>
    Password: &nbsp;<input type="password" name="pwd" id="pwd" style="margin-right: 1rem" required />
  </p>
  <hr style="margin-top: 1rem; border: none; border-top: 1px solid #333" />
  &nbsp;

  <div id="forms"></div>
  <script>
    document.getElementById("places_search").onclick = () => {
      var search = document.getElementById("search").value;

      fetch("./api/searchplaces.php?search=" + search)
        .then((response) => response.json())
        .then((data) => {
          document.getElementById("forms").innerHTML = "";

          data.forEach((place) => {
            var place_id = place.id;
            var place_name = place.name;
            var place_aka = place.aka;
            var place_coords = place.lat + ", " + place.lon;
            var place_country = place.country;
            var place_desc = place.html_desc;
            var place_population = parseInt(place.population);
            var place_population_metro = parseInt(place.population_metro);
            var place_date = place.date;
            var place_company = place.company;
            var place_song = place.song;
            var place_status = place.status_id;
            var place_category = place.category_id;
            var place_special = 0;
            var old_place_image_url = place.image_url;

            

            if (place_category.toString().endsWith("0")) {
              place_special = 2;
              place_category += 2;
            } else if (place_category.toString().endsWith("1")) {
              place_special = 1;
              place_category += 1;
            }

            console.log("place_category: " + place_category);
            console.log("place_special: " + place_special);
            console.log("place_status: " + place_status);

            const form = document.createElement("form");
            form.method = "post";
            form.id = `place_form_${place.id}`;
            form.enctype = "multipart/form-data";

            form.innerHTML = `
                      <p>
                        Name:<br />
                        <input type="text" name="place_name" id="place_name_${place_id}" value="${place_name}" required /><br />
                        Aka:<br />
                        <input type="text" name="place_aka" id="place_aka_${place_id}" value="${place_aka}"><br/>
                        Coordinates (lat,long):<br />
                        <input
                          type="text"
                          name="place_coords"
                          id="place_coords_${place_id}"
                          value="${place_coords}"
                          required
                        /><br />
                        Country: <br>
                        <input type="text" name="place_country" id="place_country_${place_id}" value="${place_country}" required><br>
                        Description: <br />
                        <textarea name="place_desc" id="place_desc_${place_id}">${place_desc}</textarea><br />
                        Population: <br>
                        <input type="number" name="place_population" id="place_population_${place_id}" value="${place_population}"><br>
                        Metro Population: <br>
                        <input type="number" name="place_metro_population" id="place_metro_population_${place_id}" value="${place_population_metro}"><br>
                        Date: <br>
                        <input type="text" name="place_date" id="place_date_${place_id}" value="${place_date}"><br>
                        Company: <br>
                        <input type="text" name="place_company" id="place_company_${place_id}" value="${place_company}"><br>
                        Song: <br>
                        <input type="text" name="place_song" id="place_song_${place_id}" value="${place_song}"><br>
                        Status: <br>
                        <select name="place_status" id="place_status_${place_id}">
                          <option value=1>visited</option>
                          <option value=2>stayed overnight</option>
                          <option value=3>stopped by</option>
                          <option value=4>drove through</option>
                          <option value=5>layover / transfer</option>
                          <option value=6>departure / arrival</option>
                          <option value=0>lived</option>
                        </select><br>
                        Category:<br />
                        <select name="place_category" id="place_category_${place_id}" required>
                          <option value=32>rural/other</option>
                          <option value=22>minor</option>
                          <option value=12>major medium</option>
                          <option value=2>major big</option>
                          <option value=42>terminal</option>
                          <option value=52>park</option>
                          </select><br />
                        Special/Capital:<br />
                        <select name="place_special" id="place_special_${place_id}" required>
                          <option value=0>none</option>
                          <option value=2>special</option>
                          <option value=1>capital</option></select
                        ><br />
                        Image: <a href="${old_place_image_url}" target="_blank">${old_place_image_url}</a><br />
                        <input type="radio" id="place_image_keep" name="place_image_option" value="keep" checked> keep current<br>
                        <input type="radio" id="place_image_remove" name="place_image_option" value="remove"> remove current<br>
                        <input type="radio" id="place_image_new" name="place_image_option" value="new"> update <br>
                        URL: <input type="text" name="place_image_url" id="place_image_url_${place_id}" /><br />
                        OR: <input type="file" name="place_image" id="place_image_${place_id}" style="margin-right: 1rem;"><br>
                        &nbsp;
                      </p>
                      <button type="submit" id="place_submit_${place_id}" style="margin-right: 1rem;">Change</button>
                      <button class="delete" id="place_remove_${place_id}">Remove</button>`;

            document.getElementById("forms").appendChild(form);
            document.getElementById(`place_category_${place_id}`).value =
              place_category.toString();
            document.getElementById(`place_special_${place_id}`).value =
              place_special.toString();
            document.getElementById(`place_status_${place_id}`).value = place_status.toString();

            const resultDiv = document.createElement("div");
            resultDiv.id = `response_${place_id}`;
            resultDiv.style = "margin-top: 1rem; white-space: pre-wrap";
            document.getElementById("forms").appendChild(resultDiv);

            const hr = document.createElement("hr");
            hr.style = "margin-top: 1rem; margin-bottom: 1rem; border: none; border-top: 1px solid #333";
            document.getElementById("forms").appendChild(hr);

            form.addEventListener("submit", function (event) {
              event.preventDefault();
              var formData = new FormData(form);
              formData.append("place_id", place_id);
              formData.append("place_pwd", document.getElementById("pwd").value);
              formData.append("old_place_image_url", old_place_image_url);
              var xhr = new XMLHttpRequest();
              xhr.open("POST", "./api/updateplace.php", true);
              xhr.onload = function () {
                if (xhr.status == 200) {
                  document.getElementById(`response_${place_id}`).innerHTML = xhr.responseText;
                }
              };
              xhr.onerror = function () {
                document.getElementById("response").innerHTML =
                  "Error: " + xhr.statusText;
              };
              xhr.send(formData);
              document.getElementById(`place_submit_${place_id}`).disabled = true;
              document.getElementById(`place_remove_${place_id}`).disabled = true;

            });

            document.getElementById(`place_remove_${place_id}`).onclick = () => {
              //var pwd = document.getElementById(`place_pwd_${place_id}`).value;
              pwd = document.getElementById("pwd").value;
              var xhr = new XMLHttpRequest();
              xhr.open("POST", "./api/removeplace.php", true);
              xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
              xhr.onload = function () {
                if (xhr.status == 200) {
                  document.getElementById(`response_${place_id}`).innerHTML = xhr.responseText;
                }
              };
              xhr.onerror = function () {
                document.getElementById("response").innerHTML =
                  "Error: " + xhr.statusText;
              };
              xhr.send(`place_id=${place_id}&place_pwd=${pwd}&old_place_image_url=${old_place_image_url}`);
              document.getElementById(`place_submit_${place_id}`).disabled = true;
              document.getElementById(`place_remove_${place_id}`).disabled = true;
            };
          });
        });
    };
  </script>
