<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/diamond-half-gold.svg" />
    <link rel="stylesheet" href="main.css" />
    <title>Add Place</title>
  </head>
  <body>
    <style>
      body {
        background-color: #111;
        color: #c0c0c0;
        padding: 1rem;
      }

      form textarea {
        width: 15rem;
        height: 5rem;
      }

      a {
        color: #c0c0c0;
        text-decoration: none;
      }

      a:hover {
        color: #aea787;
      }
    </style>

    <div style="display: flex; gap: 1rem">
      <h3 style="color: #aea787">Add Place</h3>
      <a href="edit.html"><h3>Edit Place</h3></a>
    </div>
    <hr style="margin-top: 1rem; border: none; border-top: 1px solid #333" />
    &nbsp;

    <form method="post" id="place_form" enctype="multipart/form-data">
      <p>
        Image:<br />
        <input type="file" name="place_image" id="place_image" /><br />
        &nbsp;<br />
        Password:<br />
        <input type="password" name="place_pwd" id="place_pwd" required /><br />
        &nbsp;
      </p>
      <button type="submit" id="place_submit">Submit</button>
    </form>

    <div id="response" style="margin-top: 1rem; white-space: pre-wrap"></div>

    <script>
      document
        .getElementById("place_form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          var form = document.getElementById("place_form");
          var formData = new FormData(form);
          var xhr = new XMLHttpRequest();
          xhr.open("POST", "./api/uploadimage.php", true);
          xhr.onload = function () {
            if (xhr.status == 200) {
              document.getElementById("response").innerHTML = xhr.responseText;
            }
          };
          xhr.onerror = function () {
            document.getElementById("response").innerHTML =
              "Error: " + xhr.statusText;
          };
          xhr.send(formData);
        });
    </script>
  </body>
</html>
